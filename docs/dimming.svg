<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="Brightness holds for 5 minutes of idle, steps down to 10% over the next 10 minutes, and jumps back when you return">
  <title>Brightness holds for 5 minutes of idle, steps down to 10% over the next 10 minutes, and jumps back when you return</title>
  <!-- Frosted glass over a blurred wallpaper wash, drawn on its own card so it reads the same on GitHub's light and dark themes. -->
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif; fill: #1D1D1F; }
    .label { font-size: 13px; font-weight: 600; }
    .note { font-size: 12px; fill: #6E6E73; }
    .text-orange { fill: #C2540A; }
    .fill-orange { fill: #F2711C; }
    .stroke-orange { stroke: #F2711C; }
    .line { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .thin { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .rule { fill: none; stroke: #3C3C43; stroke-opacity: 0.22; stroke-width: 1.5; }
    .dash { fill: none; stroke: #3C3C43; stroke-opacity: 0.28; stroke-width: 1.5; stroke-dasharray: 3 5; }
    .glass { fill: #FFFFFF; fill-opacity: 0.66; stroke: #FFFFFF; stroke-opacity: 0.9; stroke-width: 1; }
    .surface { fill: #FFFFFF; fill-opacity: 0.92; stroke: #C7C7CC; stroke-width: 1.5; }
  </style>
  <defs>
    <clipPath id="card"><rect width="880" height="300" rx="22"/></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#2A1F5C" flood-opacity="0.12"/></filter>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2711C" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#F2711C" stop-opacity="0.02"/>
    </linearGradient>
    <clipPath id="lens"><circle cx="262" cy="108" r="29"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="880" height="300" fill="#F2F1F8"/>
    <g filter="url(#blur)" opacity="0.75">
      <circle cx="70.4" cy="45" r="230" fill="#FFB36B"/>
      <circle cx="440" cy="-15" r="230" fill="#FF8FA8"/>
      <circle cx="809.6" cy="90" r="220" fill="#FFCF7A"/>
      <circle cx="220" cy="345" r="220" fill="#C9A6FF"/>
      <circle cx="704" cy="330" r="210" fill="#FF9E7A"/>
    </g>
  </g>
  <rect x="20" y="20" width="840" height="260" rx="16" class="glass" filter="url(#lift)"/>
  <text x="64" y="48" class="label">You walk away</text>
  <text x="64" y="66" class="note">Brightness at 75%</text>
  <text x="192.7" y="48" class="label">5 min idle</text>
  <text x="192.7" y="66" class="note">Fade begins</text>
  <text x="450.1" y="48" text-anchor="middle" class="label">15 min</text>
  <text x="450.1" y="66" text-anchor="middle" class="note">Floor of 10%</text>
  <text x="784.5" y="48" text-anchor="middle" class="label">You're back</text>
  <text x="784.5" y="66" text-anchor="middle" class="note">Restored at once</text>
  <path d="M192.7 78 V260 M450.1 78 V260 M784.5 78 V260" class="dash"/>
  <path d="M64 125 H192.7 V127.9 H199.1 V130.8 H205.6 V133.8 H212.0 V136.7 H218.4 V139.6 H224.9 V142.6 H231.3 V145.5 H237.7 V148.4 H244.2 V151.3 H250.6 V154.2 H257.0 V157.2 H263.5 V160.1 H269.9 V163.0 H276.4 V165.9 H282.8 V168.9 H289.2 V171.8 H295.7 V174.7 H302.1 V177.7 H308.5 V180.6 H315.0 V183.5 H321.4 V186.4 H327.8 V189.3 H334.3 V192.3 H340.7 V195.2 H347.1 V198.1 H353.6 V201.1 H360.0 V204.0 H366.4 V206.9 H372.9 V209.8 H379.3 V212.8 H385.8 V215.7 H392.2 V218.6 H398.6 V221.5 H405.1 V224.4 H411.5 V227.4 H417.9 V230.3 H424.4 V233.2 H430.8 V236.1 H437.2 V239.1 H443.7 V242.0 H450.1 H784.5 V125 H836 V260 H64 Z" fill="url(#glow)"/>
  <path d="M64 125 H192.7 V127.9 H199.1 V130.8 H205.6 V133.8 H212.0 V136.7 H218.4 V139.6 H224.9 V142.6 H231.3 V145.5 H237.7 V148.4 H244.2 V151.3 H250.6 V154.2 H257.0 V157.2 H263.5 V160.1 H269.9 V163.0 H276.4 V165.9 H282.8 V168.9 H289.2 V171.8 H295.7 V174.7 H302.1 V177.7 H308.5 V180.6 H315.0 V183.5 H321.4 V186.4 H327.8 V189.3 H334.3 V192.3 H340.7 V195.2 H347.1 V198.1 H353.6 V201.1 H360.0 V204.0 H366.4 V206.9 H372.9 V209.8 H379.3 V212.8 H385.8 V215.7 H392.2 V218.6 H398.6 V221.5 H405.1 V224.4 H411.5 V227.4 H417.9 V230.3 H424.4 V233.2 H430.8 V236.1 H437.2 V239.1 H443.7 V242.0 H450.1 H784.5 V125 H836" class="line stroke-orange"/>
  <path d="M64 260 H836" class="rule"/>
  <text x="74" y="151" class="label text-orange">About 10%</text>
  <text x="74" y="168" class="note">battery per hour</text>
  <text x="622.8" y="215" class="label text-orange">About 3.5%</text>
  <text x="622.8" y="232" class="note">battery per hour</text>
  <circle cx="292.5" cy="171.8" r="8" class="thin stroke-orange"/>
  <path d="M289.1 164.6 L274.9 135.1" class="thin stroke-orange" stroke-width="1.5"/>
  <circle cx="262" cy="108" r="30" class="surface"/>
  <path d="M228 92 H242 V102 H256 V112 H270 V122 H284 V132 H298" clip-path="url(#lens)" class="line stroke-orange"/>
  <circle cx="262" cy="108" r="30" class="thin stroke-orange" stroke-width="1.5"/>
  <text x="304" y="106" class="label">A step every 15 s</text>
  <text x="304" y="124" class="note">40 even steps</text>
  <path d="M777.5 121 L772.3 118 M781.8 117.5 L779.7 111.8 M787.2 117.5 L789.3 111.8 M791.5 121 L796.7 118" class="thin stroke-orange"/>
  <circle cx="784.5" cy="125" r="4" class="fill-orange"/>
</svg>
